<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post — Ilham Hasan Chowdhury, CFA</title>
  <meta name="theme-color" content="#0b1b3a">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Newsreader:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/sections.css">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}</script>
</head>
<body class="post-page">
  <header class="nav" id="nav">
    <div class="wrap nav-inner">
      <a href="index.html" class="brand" aria-label="Ilham Hasan Chowdhury — home">
        <span class="brand-mark">IH</span>
        <span class="brand-name">Ilham Hasan <em class="serif">Chowdhury</em></span>
      </a>
      <div class="nav-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle light and dark theme">
          <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="btn btn-primary" href="index.html#insights" style="--pad:.6rem 1.1rem">All posts</a>
      </div>
    </div>
  </header>

  <main id="main">
    <section class="post-hero">
      <div class="wrap">
        <a class="back" href="index.html#insights">← Back to insights</a>
        <div class="meta" id="postMeta"></div>
        <h1 id="postTitle">Loading…</h1>
      </div>
    </section>
    <article class="post-body" id="postBody"></article>
    <nav class="post-nav" id="postNav" aria-label="More posts"></nav>
  </main>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/content.js"></script>
  <script>
    (function () {
      var slug = new URLSearchParams(location.search).get("slug");
      var body = document.getElementById("postBody");
      Content.loadPosts().then(function (posts) {
        posts.sort(function (a, b) { return b.date.localeCompare(a.date); });
        var i = posts.findIndex(function (p) { return p.slug === slug; });
        if (i < 0) throw new Error("not found");
        var p = posts[i], e = Content.esc;
        document.title = p.title + " — Ilham Hasan Chowdhury, CFA";
        document.getElementById("postTitle").textContent = p.title;
        document.getElementById("postMeta").innerHTML =
          '<span class="tag">' + e(p.tag) + "</span><span>" + Content.fmtDate(p.date) + "</span><span>" + Content.readTime(p.body) + "</span>" +
          (p.draft ? '<span class="draft">DRAFT</span>' : "");
        body.innerHTML = (p.draft ? '<p class="post-notice"><strong>Draft:</strong> this is placeholder text to be reviewed and replaced before publication.</p>' : "") + p.body;
        var prev = posts[i + 1], next = posts[i - 1];
        document.getElementById("postNav").innerHTML =
          (prev ? '<a class="btn btn-outline" href="post.html?slug=' + encodeURIComponent(prev.slug) + '">← ' + e(prev.title) + "</a>" : "<span></span>") +
          (next ? '<a class="btn btn-outline" href="post.html?slug=' + encodeURIComponent(next.slug) + '">' + e(next.title) + " →</a>" : "");
      }).catch(function () {
        document.getElementById("postTitle").textContent = "Post not found";
        body.innerHTML = '<p>That post doesn’t exist. <a class="accent" href="index.html#insights">Browse all posts</a>.</p>';
      });
    })();
  </script>
</body>
</html>
